name: Daily IDX Screener

on:
  schedule:
    # 01:00 UTC = 08:00 WIB (Senin-Jumat, hari bursa buka)
    - cron: "0 1 * * 1-5"
  workflow_dispatch: {}   # tombol "Run workflow" manual di tab Actions

permissions:
  contents: write

jobs:
  run-analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Jalankan analisis
        run: python scripts/analyze.py

      - name: Commit & push hasil
        run: |
          git config user.name "idx-screener-bot"
          git config user.email "actions@github.com"
          git add docs/data.json
          git diff --staged --quiet || git commit -m "Update data harian $(date -u +'%Y-%m-%d')"
          git push
